name: ews-agrointelligence
x-app: &app
  env_file: .env
  environment: &appenv
    NODE_ENV: production
    DB_DRIVER: postgres
    DATABASE_URL: postgresql://agro:${POSTGRES_PASSWORD:?Defina uma senha URL-safe}@db:5432/agro
    HOST: 0.0.0.0
    PORT: 4000
    TRUST_PROXY: "1"
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped
  init: true
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: agro
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]
  migrate:
    <<: *app
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: api}
    command: ["node", "packages/database/migrate.ts"]
    restart: "no"
    networks: [internal]
  api:
    <<: *app
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: api}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
  worker:
    <<: *app
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: worker}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.ts"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
    networks: [internal, outbound]
  web:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: web, args: {API_INTERNAL_URL: "http://api:4000"}}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    init: true
    networks: [internal]
  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
    depends_on: [web, api]
    restart: unless-stopped
    networks: [internal, outbound]
volumes:
  postgres_data:
networks:
  internal: {internal: true}
  outbound:
