name: Verify AgroIntelligence
on:
  pull_request:
  push:
    branches: [feat/agrointelligence-production-ready-2-1]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ews-agrointelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:2.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: ews-agrointelligence/test-results/
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: agro_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: agro_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agro_test -d agro_test" --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: ews-agrointelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/core.test.ts
        env:
          TEST_DB_DRIVER: postgres
          DATABASE_URL: postgresql://agro_test:disposable_ci_only@127.0.0.1:5432/agro_test
      - run: docker exec '${{ job.services.postgres.id }}' createdb -U agro_test agro_verify
      - run: node --test tests/postgres.test.ts
        env:
          TEST_POSTGRES_URL: postgresql://agro_test:disposable_ci_only@127.0.0.1:5432/agro_verify
      - name: Backup and restore in disposable database
        run: |
          docker exec '${{ job.services.postgres.id }}' pg_dump -U agro_test -d agro_verify -Fc > /tmp/agro-ci.dump
          docker exec '${{ job.services.postgres.id }}' createdb -U agro_test agro_restore
          docker exec -i '${{ job.services.postgres.id }}' pg_restore -U agro_test -d agro_restore --no-owner --exit-on-error < /tmp/agro-ci.dump
          for database in agro_verify agro_restore; do
            docker exec '${{ job.services.postgres.id }}' psql -U agro_test -d "$database" -At -c 'SELECT count(*) FROM production; SELECT count(*) FROM users; SELECT count(*) FROM schema_migrations;' > "/tmp/$database.counts"
          done
          diff /tmp/agro_verify.counts /tmp/agro_restore.counts
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ews-agrointelligence
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - run: docker build --target web -f infrastructure/docker/Dockerfile .
      - if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
